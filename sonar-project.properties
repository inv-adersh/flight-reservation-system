sonar.organization=inv-adersh
sonar.projectKey=inv-adersh_flight-reservation-system

sonar.projectName=Flight Reservation System
sonar.projectVersion=1.0

# Source directories
sonar.sources=backend,frontend-v2/src

# Exclusions - files SonarCloud should NOT scan as source
sonar.exclusions=\
  **/venv/**,\
  **/__pycache__/**,\
  **/migrations/**,\
  **/node_modules/**,\
  **/dist/**,\
  **/*.pyc,\
  **/coverage/**,\
  **/media/**,\
  **/test/**,\
  **/__tests__/**,\
  **/*.test.js,\
  **/*.test.jsx,\
  **/*.spec.js,\
  **/*.spec.jsx,\
  frontend-v2/fix.py,\
  frontend-v2/parse_lint.cjs

# Test files
sonar.tests=backend,frontend-v2/src

sonar.test.inclusions=\
  **/test/**/*,\
  **/__tests__/**/*,\
  **/tests/**/*,\
  **/test_*.py,\
  **/*_test.py,\
  **/*.test.js,\
  **/*.test.jsx,\
  **/*.spec.js,\
  **/*.spec.jsx

# Encoding
sonar.sourceEncoding=UTF-8

# Coverage report paths
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.javascript.lcov.reportPaths=frontend-v2/coverage/lcov.info
