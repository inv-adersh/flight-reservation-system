name: SonarQube Analysis

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  sonarcloud:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies & Run Backend Coverage
        env:
          SECRET_KEY: test-secret-key-for-ci
        run: |
          cd backend
          python -m pip install --upgrade pip==25.3
          if [ -f requirements.txt ]; then
            python -m pip install --only-binary :all: -r requirements.txt
          fi

          python -m pip install --only-binary :all: coverage==7.10.6

          echo "===== TEST FILES ====="
          find apps -type f \( -name "test*.py" -o -name "*test*.py" \)

          python -m coverage erase

          python -m coverage run manage.py test apps || true

          echo "===== DJANGO TEST DISCOVERY ====="
          python manage.py test apps --verbosity=2 || true

          echo "===== COVERAGE REPORT ====="
          python -m coverage report

          echo "===== COVERAGE DEBUG ====="
          python -m coverage debug data

          python -m coverage xml -o coverage.xml

      # NEW: Frontend coverage
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend-v2/package-lock.json

      - name: Install Frontend Dependencies & Run Coverage
        working-directory: frontend-v2
        run: |
          npm ci
          npm run test:coverage -- --run

      # NEW: Check frontend coverage report
      - name: Check Frontend Coverage Report
        run: |
          ls -lh frontend-v2/coverage/
          ls -lh frontend-v2/coverage/lcov.info

      - name: Check coverage report
        run: |
          ls -lh backend/coverage.xml
          grep -E "lines-valid|lines-covered|line-rate" backend/coverage.xml | head -1
          grep -E '<class ' backend/coverage.xml | head -20

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@ba3875ecf642b2129de2b589510c81a8b53dbf4e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}