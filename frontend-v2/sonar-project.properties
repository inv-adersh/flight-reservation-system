# ================================================================
# SonarQube Configuration - Flight Reservation System Frontend
# ================================================================

# Project Identification
sonar.projectKey=flight-reservation-frontend
sonar.projectName=Flight Reservation System - Frontend
sonar.projectVersion=1.0

# Source code location
sonar.sources=src

# Exclude files/dirs that should NOT be scanned
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/coverage/**,\
  **/test/**,\
  **/*.test.jsx,\
  **/*.test.js,\
  **/*.spec.js,\
  **/*.spec.jsx

# Test file inclusions
sonar.tests=src
sonar.test.inclusions=\
  **/*.test.jsx,\
  **/*.test.js,\
  **/*.spec.js,\
  **/*.spec.jsx

# JavaScript / JSX support
sonar.language=js

# Coverage report generated by: npm run test:coverage
# This expects: coverage/lcov.info
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# SonarQube Server Connection
sonar.host.url=http://localhost:9000

# Auth Token - Replace with your actual token from SonarQube dashboard
# Go to: http://localhost:9000 → My Account → Security → Generate Token
sonar.token=YOUR_TOKEN_HERE

# Encoding
sonar.sourceEncoding=UTF-8