# ============================================================
# SonarQube Configuration - Flight Reservation System Backend
# ============================================================

# Project Identification
sonar.projectKey=flight-reservation-backend
sonar.projectName=Flight Reservation System - Backend
sonar.projectVersion=1.0

# Source code location
sonar.sources=.

# Exclude files/dirs that should NOT be scanned
sonar.exclusions=\
  **/venv/**,\
  **/__pycache__/**,\
  **/migrations/**,\
  **/node_modules/**,\
  **/*.pyc,\
  db.sqlite3,\
  **/media/**,\
  **/static/**,\
  output.json,\
  output2.json

# Test source location
sonar.tests=.
sonar.test.inclusions=test_*.py,**/test_*.py,**/tests/*.py

# Python version
sonar.python.version=3

# Coverage report generated by: coverage xml -o coverage.xml
sonar.python.coverage.reportPaths=coverage.xml

# SonarQube Server Connection
sonar.host.url=http://localhost:9000

# Auth Token - Replace with your actual token from SonarQube dashboard
# Go to: http://localhost:9000 → My Account → Security → Generate Token
sonar.token=YOUR_TOKEN_HERE

# Encoding
sonar.sourceEncoding=UTF-8
